<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Utku Karaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --accent: #c8ff00; --bg: #080808; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .logo { color: var(--accent); font-size: 14px; letter-spacing: 0.2em; margin-bottom: 60px; }
  .code { font-size: clamp(80px, 20vw, 160px); font-weight: 700; line-height: 1; color: var(--accent); opacity: 0.15; }
  h1 { font-size: clamp(24px, 5vw, 40px); font-weight: 700; margin-top: -20px; margin-bottom: 16px; }
  p { color: #666; font-size: 16px; margin-bottom: 40px; }
  a {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 14px 32px;
    text-decoration: none;
    text-transform: uppercase;
  }
  a:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="logo">UK_</div>
  <div class="code">404</div>
  <h1>Page not found.</h1>
  <p>This page doesn't exist — but the rest of the site does.</p>
  <a href="/">← Back to home</a>
</body>
</html>
